# Baut die Windows-EXE automatisch, sobald du auf GitHub ein Release veröffentlichst.
# Datei im Repository ablegen unter:  .github/workflows/build-exe.yml

name: Windows-EXE bauen

on:
  release:
    types: [published]   # automatisch beim Veröffentlichen eines Releases
  workflow_dispatch:     # oder von Hand über den Tab "Actions" (zum Testen)

permissions:
  contents: write        # nötig, um die EXE an das Release anzuhängen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install requests pillow pystray pyinstaller

      - name: EXE bauen
        run: python -m PyInstaller --clean --onefile --noconsole --name TwitchLiveAlert --hidden-import pystray._win32 twitch_alert_gui.py

      - name: EXE als Download bereitstellen (für manuelle Tests)
        uses: actions/upload-artifact@v4
        with:
          name: TwitchLiveAlert
          path: dist/TwitchLiveAlert.exe

      - name: EXE an das Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/TwitchLiveAlert.exe
